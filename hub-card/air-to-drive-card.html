<!--
  Air to Drive — hub card (standalone HTML + CSS)
  Paste the <a class="vc-card"> ... </a> block into your VectorCraft Digital hub grid.
  Put air-to-drive-logo.jpg next to this file (or update the <img src>).
  Class names are prefixed "vc-" so they won't clash with your existing styles.
  This file is previewable on its own (open it in a browser).
-->
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Air to Drive — hub card</title>
    <style>
      :root {
        --vc-bg: #0e0e0f;
        --vc-surface: #15161a;
        --vc-border: #2c2c2e;
        --vc-text: #ffffff;
        --vc-muted: #8e8e93;
        --vc-cyan: #00e5ff;
      }
      body {
        margin: 0;
        background: var(--vc-bg);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        padding: 40px;
      }
      /* demo grid — your hub likely already provides this */
      .vc-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
        gap: 24px;
        max-width: 1120px;
        margin: 0 auto;
      }

      /* ---- the card ---- */
      .vc-card {
        display: flex;
        flex-direction: column;
        background: var(--vc-surface);
        border: 1px solid var(--vc-border);
        border-radius: 20px;
        overflow: hidden;
        text-decoration: none;
        color: var(--vc-text);
        transition: transform 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease;
      }
      .vc-card:hover {
        transform: translateY(-4px);
        border-color: rgba(0, 229, 255, 0.5);
        box-shadow: 0 12px 40px rgba(0, 229, 255, 0.18);
      }
      .vc-card__media {
        aspect-ratio: 16 / 10;
        display: flex;
        align-items: center;
        justify-content: center;
        background: radial-gradient(120% 120% at 50% 0%, #0c1b20 0%, #08090c 70%);
        border-bottom: 1px solid var(--vc-border);
      }
      .vc-card__media img {
        height: 72%;
        width: auto;
        object-fit: contain;
      }
      .vc-card__body {
        padding: 20px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .vc-card__badge {
        align-self: flex-start;
        font-size: 11px;
        letter-spacing: 1.5px;
        font-weight: 700;
        color: var(--vc-cyan);
        background: rgba(0, 229, 255, 0.12);
        border: 1px solid rgba(0, 229, 255, 0.3);
        border-radius: 6px;
        padding: 3px 8px;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .vc-card__title {
        margin: 2px 0 0;
        font-size: 20px;
        font-weight: 800;
        letter-spacing: -0.3px;
      }
      .vc-card__desc {
        margin: 0;
        font-size: 14px;
        line-height: 1.5;
        color: var(--vc-muted);
      }
      .vc-card__cta {
        margin-top: 8px;
        align-self: flex-start;
        font-size: 14px;
        font-weight: 700;
        color: #000;
        background: var(--vc-cyan);
        border-radius: 10px;
        padding: 10px 18px;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
    </style>
  </head>
  <body>
    <div class="vc-grid">
      <!-- ===== COPY FROM HERE ===== -->
      <a
        class="vc-card"
        href="https://airtodrive.com"
        target="_blank"
        rel="noopener noreferrer"
      >
        <div class="vc-card__media">
          <img src="air-to-drive-mark.png" alt="Air to Drive" />
        </div>
        <div class="vc-card__body">
          <span class="vc-card__badge">ANDROID · PWA</span>
          <h3 class="vc-card__title">Air to Drive</h3>
          <p class="vc-card__desc">
            Download massive files straight to an external USB drive — zero phone
            storage required.
          </p>
          <span class="vc-card__cta">Open App →</span>
        </div>
      </a>
      <!-- ===== COPY TO HERE ===== -->
    </div>
  </body>
</html>
