name: Build Android APK

on:
  workflow_dispatch:        # "Run workflow" button in the Actions tab
  push:
    branches: [main]

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90     # fail instead of hanging for hours
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4   # caches Gradle between runs

      - name: Install dependencies (also applies the VisionCamera patch)
        run: |
          corepack enable
          yarn install --frozen-lockfile

      - name: Generate native Android project
        run: npx expo prebuild --platform android --clean --no-install

      - name: Build release APK
        working-directory: frontend/android
        # arm64 only: covers modern phones and cuts native C++ build time ~75%.
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a

      - uses: actions/upload-artifact@v4
        with:
          name: air-to-drive-apk
          path: frontend/android/app/build/outputs/apk/release/app-release.apk
